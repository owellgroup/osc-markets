# Non-sensitive defaults live here. Credentials and hosts come from .env or the process environment.

server.port=8286
server.address=0.0.0.0
server.forward-headers-strategy=framework

spring.application.name=osc-store

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=70MB

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.debug=false

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,http://145.241.187.174:5173,http://145.241.187.174:4173,http://145.241.187.174}

app.jwt.secret=osc-markets-demo-jwt-secret-change-before-going-live-64chars-min
app.jwt.expiration-hours=12

app.minio.endpoint=${MINIO_ENDPOINT}
app.minio.access-key=${MINIO_ACCESS_KEY}
app.minio.secret-key=${MINIO_SECRET_KEY}
app.minio.bucket=${MINIO_BUCKET:osc-markets}
app.minio.public-url=${MINIO_PUBLIC_URL:${MINIO_ENDPOINT}/${MINIO_BUCKET:osc-markets}}

app.mail.from=${SPRING_MAIL_FROM}
app.mail.from-name=OSC Markets
app.mail.notify-to=
app.mail.logo-url=https://res.cloudinary.com/dtlbdcpau/image/upload/v1792678658/logo-white.png

app.company.name=OSC Markets
app.company.email=quotes@osc-markets.com
app.company.phone=+27 10 000 0000
app.company.website=${SITE_URL:http://145.241.187.174:5173}

app.bank.bank-name=First National Bank (FNB)
app.bank.account-name=OSC Markets (Pty) Ltd
app.bank.account-number=62000000000
app.bank.account-type=Business Cheque Account
app.bank.branch-code=250655
app.bank.swift=FIRNZAJJ

app.super-admin.name=Joel
app.super-admin.email=joel@wayaspot.com
app.super-admin.password=Admin@123
