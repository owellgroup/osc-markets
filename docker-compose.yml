services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: osc_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches outgoing mail locally. Open http://localhost:8025 to read the quote emails.
  # Production uses the existing SMTP host from .env. This service is optional for local work.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
