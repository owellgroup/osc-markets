# Dokploy stack. Traefik already binds 80/443/8080 on the host.
# Do not publish those ports. Attach a domain to the `web` service in Dokploy (container port 80).
# The browser talks only to `web`. Nginx proxies /api to the `api` container.

services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      SERVER_PORT: "8286"
      SERVER_ADDRESS: "0.0.0.0"
      CORS_ORIGINS: "*"
      SITE_URL: ${SITE_URL:-http://145.241.187.174}
    expose:
      - "8286"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped
