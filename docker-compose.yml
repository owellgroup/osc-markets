# Dokploy already owns 80, 443 and 8080. Do not bind those.
# Open these on the server IP:
#   Site:  http://145.241.187.174:5186
#   Admin: http://145.241.187.174:5186/admin
#   API:   http://145.241.187.174:8286
# Nginx on web still proxies /api to the api container.

services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      SERVER_PORT: "8286"
      SERVER_ADDRESS: "0.0.0.0"
      CORS_ORIGINS: "*"
      SITE_URL: http://145.241.187.174:5186
    ports:
      - "8286:8286"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "5186:80"
    depends_on:
      - api
    restart: unless-stopped
