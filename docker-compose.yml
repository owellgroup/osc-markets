# Live stack on 145.241.187.174
# Frontend: http://145.241.187.174 and http://145.241.187.174:5173
# API:      http://145.241.187.174:8286
# MinIO and Postgres are the existing servers from .env — not started here.

services:
  api:
    build:
      context: ./backend
    ports:
      - "8286:8286"
    env_file:
      - .env
    environment:
      SERVER_PORT: "8286"
      SERVER_ADDRESS: "0.0.0.0"
      CORS_ORIGINS: "http://145.241.187.174,http://145.241.187.174:5173,http://145.241.187.174:4173,http://localhost:5173"
      SITE_URL: "http://145.241.187.174"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://145.241.187.174:8286
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
