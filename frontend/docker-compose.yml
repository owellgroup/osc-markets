# Frontend only. Deploy this directory on its own.
# Site: http://92.4.136.176:5173
# API is not in this stack. The built app calls VITE_API_URL.

services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://92.4.136.176:8286}
    ports:
      - "5173:5173"
    restart: unless-stopped
